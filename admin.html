<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel Administrativo - Apassul</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Painel de Inscrições - Apassul</h1>

  <h2>Resumo por curso</h2>
  <table id="tabelaResumo">
    <thead>
      <tr><th>Curso</th><th>Vagas totais</th><th>Inscritos</th><th>Vagas restantes</th></tr>
    </thead>
    <tbody><!-- preenchido pelo admin.js --></tbody>
  </table>

  <h2>Lista de inscritos</h2>
  <table id="tabelaInscritos">
    <thead>
      <tr><th>Nome</th><th>E-mail</th><th>Curso</th><th>Data</th></tr>
    </thead>
    <tbody><!-- preenchido pelo admin.js --></tbody>
  </table>

  <p id="mensagemAdmin"></p>

  <script src="admin.js"></script>
</body>
</html>
