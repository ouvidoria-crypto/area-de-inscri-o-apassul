<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Apassul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-admin">

  <h1>Painel de Inscrições - Apassul</h1>

  <h2>Resumo por curso</h2>
  <div class="tabela-scroll">
    <table id="tabelaResumo">
      <thead>
        <tr><th>Curso</th><th>Valor</th><th>Vagas totais</th><th>Inscritos</th><th>Pagos</th><th>Vagas restantes</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="cabecalho-secao">
    <h2>Lista de inscritos</h2>
    <button id="btnExportarCSV" type="button" class="btn-secundario">
      <svg class="icone-csv" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="3" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="2"/>
        <line x1="3" y1="15" x2="21" y2="15" stroke="currentColor" stroke-width="2"/>
        <line x1="9" y1="3" x2="9" y2="21" stroke="currentColor" stroke-width="2"/>
        <line x1="15" y1="3" x2="15" y2="21" stroke="currentColor" stroke-width="2"/>
      </svg>
      Baixar CSV
    </button>
  </div>
  <div class="tabela-scroll">
    <table id="tabelaInscritos">
      <thead>
        <tr>
          <th>Nome</th><th>Empresa</th><th>E-mail</th><th>Telefone</th><th>CPF</th>
          <th>Curso</th><th>Valor</th><th>Pagamento</th><th>Status</th><th>E-mail recibo</th><th>Data</th><th>Ação</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <p id="mensagemAdmin"></p>

  <script src="admin.js"></script>
</body>
</html>
