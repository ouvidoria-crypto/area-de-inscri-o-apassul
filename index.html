<!DOCTYPE html>
<!-- Isso avisa o navegador: "este arquivo é HTML moderno". Toda página começa assim. -->
<html lang="pt-br">
<head>
  <!-- O <head> guarda informações que NÃO aparecem na tela, mas configuram a página -->
  <meta charset="UTF-8">
  <title>Inscrições Apassul</title>
  <link rel="stylesheet" href="style.css">
  <!-- O texto do <title> aparece na aba do navegador -->
</head>
<body>
  <!-- O <body> é onde fica tudo que APARECE na tela -->

  <h1>Inscreva-se para Cursos - Apassul </h1>
  <!-- h1 = título principal (heading nível 1) -->

  <p>Preencha o formulário abaixo para se inscrever em um dos nossos cursos.</p>
  <!-- p = parágrafo de texto -->

  <h2>Formulário de inscrição</h2>

  <form id="formInscricao">
    <!-- <form> agrupa os campos que a pessoa vai preencher -->

    <label for="nome">Nome completo:</label><br>
    <input type="text" id="nome" name="nome"><br><br>

    <label for="email">E-mail:</label><br>
    <input type="email" id="email" name="email"><br><br>

    <label for="curso">Curso:</label><br>
    <select id="curso" name="curso">
      <option value="viveiristas">Encontro de Viveiristas</option>
      <option value="sementes">Legislação de Sementes e Mudas</option>
      <option value="sementes">Rastreabilidade da Aveia</option>
    </select><br><br>

    <button type="submit">Enviar inscrição</button>
  </form>
<p id="mensagem"></p>
<script src="script.js"></script>
</body>
</html>
